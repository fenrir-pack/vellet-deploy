# Production compose for Hostinger Docker Manager.
#
# Fetched by URL (raw GitHub) and deployed on a Hostinger VPS that uses the
# bundled Traefik (network_mode: host on :80/:443 with Let's Encrypt resolver
# `letsencrypt`). The `api` service exposes itself via Traefik labels — no
# Caddy required on this VPS.
#
# One-time setup on the VPS terminal (private GHCR images):
#   echo "<GHCR_PAT>" | docker login ghcr.io -u <github-user> --password-stdin
# PAT scope: read:packages.
#
# For local dev or build-on-host fallback (no Traefik), use docker-compose.yml.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vellet
      POSTGRES_USER: vellet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vellet -d vellet']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/fenrir-pack/vellet-api:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vellet-api.rule=Host(`api.vellet.app`)"
      - "traefik.http.routers.vellet-api.entrypoints=websecure"
      - "traefik.http.routers.vellet-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.vellet-api.loadbalancer.server.port=3000"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-com.venegasdev.vellet}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY:-}
      - GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-}
      - EXPO_PUSH_ACCESS_TOKEN=${EXPO_PUSH_ACCESS_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - FX_BASES=${FX_BASES:-USD,EUR,MXN}
      - FX_TARGETS=${FX_TARGETS:-USD,EUR,MXN,GBP,JPY,COP,CLP,ARS}
      - WORKERS_ENABLED=${WORKERS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g

volumes:
  pgdata:

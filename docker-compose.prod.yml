# Production compose for Hostinger Docker Manager.
#
# Fetched by URL (raw GitHub) and deployed on a Hostinger VPS that already has:
#   1. Traefik (host network, :80/:443, Let's Encrypt resolver `letsencrypt`).
#   2. A `postgresql-u7cy` compose project running Postgres 17. We attach our
#      api container to its docker network and reach it via the service alias
#      `postgresql:5432` — no second Postgres container needed.
#
# One-time setup on the VPS terminal (private GHCR images):
#   echo "<GHCR_PAT>" | docker login ghcr.io -u <github-user> --password-stdin
# PAT scope: read:packages.
#
# For local dev or build-on-host fallback (no Traefik, no shared Postgres),
# use docker-compose.yml instead.

services:
  api:
    image: ghcr.io/fenrir-pack/vellet-api:latest
    networks:
      - postgres
    ports:
      # Bind to localhost only. The API is reached from the public internet
      # exclusively through a Cloudflare tunnel/proxy (or a future Traefik
      # router) — never directly via the host IP.
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vellet-api.rule=Host(`api.vellet.app`)"
      - "traefik.http.routers.vellet-api.entrypoints=websecure"
      - "traefik.http.routers.vellet-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.vellet-api.loadbalancer.server.port=3000"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-com.venegasdev.vellet}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY:-}
      - GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-}
      - EXPO_PUSH_ACCESS_TOKEN=${EXPO_PUSH_ACCESS_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - FX_BASES=${FX_BASES:-USD,EUR,MXN}
      - FX_TARGETS=${FX_TARGETS:-USD,EUR,MXN,GBP,JPY,COP,CLP,ARS}
      - WORKERS_ENABLED=${WORKERS_ENABLED:-true}
    restart: unless-stopped
    mem_limit: 2g

networks:
  postgres:
    name: postgresql-u7cy_default
    external: true
